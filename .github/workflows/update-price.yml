name: Update Wildberries price
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch current WB price
        run: python update-wb-price.py
      - name: Commit changed price
        run: |
          if ! git diff --quiet -- price.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add price.json
            git commit -m "Update Wildberries price"
            git push
          fi
