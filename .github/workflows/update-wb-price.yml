name: Update Wildberries price
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update price from Wildberries
        run: python update-wb-price.py
      - name: Commit price if changed
        run: |
          if git diff --quiet -- price.json; then
            echo "Price unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price.json
          git commit -m "Update Wildberries product price"
          git push
