name: Submit site to IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Notify IndexNow
        env:
          INDEXNOW_KEY: b8d6f95248174611ac4ea0c8a5de038e
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @- <<EOF
          {
            "host": "h17h4k.github.io",
            "key": "${INDEXNOW_KEY}",
            "keyLocation": "https://h17h4k.github.io/bask-putorana/${INDEXNOW_KEY}.txt",
            "urlList": [
              "https://h17h4k.github.io/bask-putorana/"
            ]
          }
          EOF
